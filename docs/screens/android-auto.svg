  <text x="116" y="298" class="b" font-size="18">Restrooms ahead</text>
  <text x="752" y="299" class="m" font-size="22" text-anchor="end">›</text>
  <rect x="96" y="324" width="680" height="52" rx="12" fill="#1A1C21"/>
  <text x="116" y="356" class="b" font-size="18">Food ahead</text>
  <text x="752" y="357" class="m" font-size="22" text-anchor="end">›</text>
