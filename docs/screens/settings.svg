<svg xmlns="http://www.w3.org/2000/svg" width="360" height="740" viewBox="0 0 360 740">
  <title>Settings (mockup)</title>
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #101828; }
    .b { font-weight: 700; } .s { font-weight: 600; } .m { fill: #475467; } .p { fill: #0B5FFF; }
    .seg { fill: #F2F4F7; } .on { fill: #fff; }
  </style>
  <defs><clipPath id="s"><rect x="8" y="8" width="344" height="724" rx="32"/></clipPath></defs>
  <rect width="360" height="740" rx="40" fill="#101828"/>
  <g clip-path="url(#s)">
    <rect x="8" y="8" width="344" height="724" fill="#F2F4F7"/>
    <rect x="8" y="8" width="344" height="84" fill="#fff"/>
    <text x="30" y="32" class="b" font-size="13">9:41</text>
    <text x="24" y="72" class="b" font-size="18">Settings</text>

    <rect x="20" y="104" width="320" height="168" rx="16" fill="#fff"/>
    <text x="36" y="130" class="b" font-size="16">Direction arrow</text>
    <text x="36" y="152" class="s" font-size="13">Heading window (D)</text>
    <text x="36" y="168" class="m" font-size="10">Arrow points from where you were D metres ago to now</text>
    <rect x="36" y="176" width="288" height="32" rx="9" class="seg"/>
    <rect x="110" y="179" width="70" height="26" rx="7" class="on"/>
    <g font-size="12" text-anchor="middle" class="s">
      <text x="72" y="197" class="m">10 m</text><text x="145" y="197" class="p">30 m</text>
      <text x="216" y="197" class="m">50 m</text><text x="288" y="197" class="m">100 m</text>
    </g>
    <text x="36" y="228" class="s" font-size="13">Map orientation</text>
    <rect x="36" y="236" width="288" height="28" rx="9" class="seg"/>
    <rect x="39" y="238" width="141" height="24" rx="7" class="on"/>
    <text x="110" y="254" class="s p" font-size="12" text-anchor="middle">Heading up</text>
    <text x="252" y="254" class="s m" font-size="12" text-anchor="middle">North up</text>

    <rect x="20" y="284" width="320" height="214" rx="16" fill="#fff"/>
    <text x="36" y="310" class="b" font-size="16">Prompts and reminders</text>
    <g font-size="13" class="s">
      <text x="36" y="338">Ask to log after a petrol pump stop</text>
      <text x="36" y="353" class="m" font-size="10">After 3+ minutes at a pump, then driving away</text>
      <text x="36" y="384">Remind me if I haven't logged fuel</text>
      <text x="36" y="450">Background trip tracking</text>
      <text x="36" y="465" class="m" font-size="10">Counts distance with the screen off</text>
      <text x="36" y="478" class="m" font-size="10">Needs location “All the time”</text>
    </g>
    <g>
      <rect x="282" y="326" width="42" height="24" rx="12" fill="#0B5FFF"/><circle cx="312" cy="338" r="9" fill="#fff"/>
      <rect x="282" y="372" width="42" height="24" rx="12" fill="#0B5FFF"/><circle cx="312" cy="384" r="9" fill="#fff"/>
      <rect x="282" y="440" width="42" height="24" rx="12" fill="#0B5FFF"/><circle cx="312" cy="452" r="9" fill="#fff"/>
    </g>
    <rect x="36" y="402" width="288" height="28" rx="9" class="seg"/>
    <rect x="110" y="404" width="70" height="24" rx="7" class="on"/>
    <g font-size="12" text-anchor="middle" class="s">
      <text x="72" y="420" class="m">7 d</text><text x="145" y="420" class="p">10 d</text>
      <text x="216" y="420" class="m">14 d</text><text x="288" y="420" class="m">30 d</text>
    </g>

    <rect x="20" y="510" width="320" height="160" rx="16" fill="#fff"/>
    <text x="36" y="536" class="b" font-size="16">Test mode</text>
    <text x="36" y="562" class="s" font-size="13">Simulate a drive: Pune → Nashik</text>
    <text x="36" y="577" class="m" font-size="10">GPS noise and a 4-minute stop near Chakan</text>
    <rect x="282" y="550" width="42" height="24" rx="12" fill="#0B5FFF"/><circle cx="312" cy="562" r="9" fill="#fff"/>
    <rect x="36" y="588" width="288" height="28" rx="9" class="seg"/>
    <rect x="134" y="590" width="92" height="24" rx="7" class="on"/>
    <g font-size="12" text-anchor="middle" class="s">
      <text x="84" y="606" class="m">40 km/h</text><text x="180" y="606" class="p">70 km/h</text><text x="276" y="606" class="m">100 km/h</text>
    </g>
    <rect x="36" y="626" width="288" height="34" rx="9" fill="#fff" stroke="#D0D5DD"/>
    <text x="180" y="648" class="b p" font-size="13" text-anchor="middle">Plan Pune → Nashik</text>

    <rect x="8" y="682" width="344" height="50" fill="#fff"/>
    <line x1="8" y1="682" x2="352" y2="682" stroke="#EAECF0"/>
    <text x="52" y="711" class="m" font-size="12" text-anchor="middle">Map</text>
    <text x="134" y="711" class="m" font-size="12" text-anchor="middle">Fuel log</text>
    <text x="222" y="711" class="m" font-size="12" text-anchor="middle">Analytics</text>
    <text x="304" y="711" class="b p" font-size="12" text-anchor="middle">Settings</text>
  </g>
</svg>
