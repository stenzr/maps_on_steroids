<svg xmlns="http://www.w3.org/2000/svg" width="360" height="740" viewBox="0 0 360 740">
  <title>Map screen while navigating (mockup)</title>
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #101828; }
    .b { font-weight: 700; } .m { fill: #475467; } .w { fill: #fff; } .p { fill: #0B5FFF; }
  </style>
  <defs>
    <clipPath id="s"><rect x="8" y="8" width="344" height="724" rx="32"/></clipPath>
    <linearGradient id="trail" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0B5FFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B5FFF" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="360" height="740" rx="40" fill="#101828"/>
  <g clip-path="url(#s)">
    <rect x="8" y="8" width="344" height="724" fill="#E9EEE4"/>
    <rect x="214" y="300" width="96" height="64" rx="8" fill="#D5E5CC"/>
    <rect x="30" y="180" width="80" height="50" rx="8" fill="#D5E5CC"/>
    <path d="M8 150 L352 222" stroke="#fff" stroke-width="10"/>
    <path d="M60 8 L118 732" stroke="#fff" stroke-width="7"/>
    <path d="M268 8 L302 520" stroke="#fff" stroke-width="7"/>
    <path d="M20 420 C 90 380 150 470 352 400" stroke="#fff" stroke-width="6" fill="none"/>
    <polyline points="176,740 178,600 186,470 182,380 168,280 200,170 236,60 244,8" fill="none" stroke="#0B5FFF" stroke-opacity="0.5" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="179,560 186,470 182,384" fill="none" stroke="url(#trail)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(176,262)"><path d="M0 0 C-11 -13 -11 -28 0 -28 C11 -28 11 -13 0 0Z" fill="#D92D20"/><circle cy="-18" r="4.5" fill="#fff"/></g>
    <g transform="translate(206,204)"><path d="M0 0 C-11 -13 -11 -28 0 -28 C11 -28 11 -13 0 0Z" fill="#B54708"/><circle cy="-18" r="4.5" fill="#fff"/></g>
    <g transform="translate(182,380)">
      <circle r="23" fill="#fff" stroke="#000" stroke-opacity="0.12"/>
      <path d="M0 -15 L11 11 L0 5 L-11 11Z" fill="#0B5FFF" transform="rotate(-6)"/>
    </g>

    <text x="30" y="32" class="b" font-size="13">9:41</text>
    <rect x="20" y="44" width="320" height="50" rx="12" fill="#fff"/>
    <text x="34" y="74" class="b" font-size="16">To Nashik · 1 stop</text>
    <rect x="20" y="104" width="158" height="50" rx="12" fill="#fff"/>
    <text x="32" y="126" class="b" font-size="17">≈ 210 km range</text>
    <text x="32" y="144" class="m" font-size="11">62% fuel</text>
    <rect x="242" y="108" width="98" height="36" rx="18" fill="#fff"/>
    <text x="291" y="131" class="b" font-size="12" text-anchor="middle">Heading up</text>

    <rect x="8" y="440" width="344" height="270" rx="20" fill="#fff"/>
    <rect x="160" y="448" width="40" height="4" rx="2" fill="#D0D5DD"/>
    <rect x="20" y="460" width="170" height="32" rx="8" fill="#0B5FFF"/>
    <text x="105" y="481" class="b w" font-size="12" text-anchor="middle">Navigate in Google Maps</text>
    <rect x="196" y="460" width="72" height="32" rx="8" fill="#fff" stroke="#D0D5DD"/>
    <text x="232" y="481" class="b p" font-size="12" text-anchor="middle">Add fuel</text>
    <rect x="274" y="460" width="66" height="32" rx="8" fill="#fff" stroke="#D0D5DD"/>
    <text x="307" y="481" class="b" font-size="12" text-anchor="middle" fill="#D92D20" style="fill:#D92D20">End</text>
    <rect x="20" y="502" width="320" height="34" rx="10" fill="#F2F4F7"/>
    <rect x="235" y="505" width="102" height="28" rx="8" fill="#fff"/>
    <text x="73" y="524" class="b m" font-size="12" text-anchor="middle">Restrooms</text>
    <text x="180" y="524" class="b m" font-size="12" text-anchor="middle">Restaurants</text>
    <text x="286" y="524" class="b p" font-size="12" text-anchor="middle">Petrol</text>

    <text x="20" y="556" class="b p" font-size="10">SUGGESTED FUEL STOP</text>
    <text x="20" y="574" class="b" font-size="14">Sai Petroleum, Sangamner</text>
    <text x="20" y="591" class="m" font-size="11">92 km ahead · +3 min · ★ 4.2 · <tspan style="fill:#027A48">Open</tspan></text>
    <text x="20" y="607" class="m" font-size="11">Petrol ₹104.21 · Diesel ₹90.80</text>
    <rect x="262" y="562" width="78" height="30" rx="8" fill="#fff" stroke="#D0D5DD"/>
    <text x="301" y="582" class="b p" font-size="12" text-anchor="middle">Add stop</text>
    <line x1="20" y1="618" x2="340" y2="618" stroke="#EAECF0"/>
    <text x="20" y="640" class="b" font-size="14">Om Fuels, Alephata</text>
    <text x="20" y="657" class="m" font-size="11">48 km ahead · +2 min · ★ 4.0 · <tspan style="fill:#027A48">Open</tspan></text>
    <rect x="262" y="628" width="78" height="30" rx="8" fill="#fff" stroke="#D0D5DD"/>
    <text x="301" y="648" class="b p" font-size="12" text-anchor="middle">Add stop</text>

    <rect x="8" y="682" width="344" height="50" fill="#fff"/>
    <line x1="8" y1="682" x2="352" y2="682" stroke="#EAECF0"/>
    <text x="52" y="711" class="b p" font-size="12" text-anchor="middle">Map</text>
    <text x="134" y="711" class="m" font-size="12" text-anchor="middle">Fuel log</text>
    <text x="222" y="711" class="m" font-size="12" text-anchor="middle">Analytics</text>
    <text x="304" y="711" class="m" font-size="12" text-anchor="middle">Settings</text>
  </g>
</svg>
