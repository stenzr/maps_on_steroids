    <g transform="translate(150,186)"><path d="M0 0 C-10 -12 -10 -26 0 -26 C10 -26 10 -12 0 0Z" fill="#C11574"/><circle cy="-17" r="4" fill="#fff"/></g>
    <text x="64" y="268" class="m" font-size="10">Pune</text>

    <rect x="20" y="284" width="320" height="80" rx="16" fill="#fff"/>
